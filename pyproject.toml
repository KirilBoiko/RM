[project]
name = "oneclick-rm-agent"
version = "0.1.0"
description = "AI Revenue Management Decision-Support Agent for OneClick Airways (4L)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "scipy>=1.14.0",
    "tableauhyperapi>=0.0.20000",
    "uvicorn>=0.32.0",
]

[project.scripts]
rm-ingest = "rm_agent.ingest:main"
rm-mcp = "rm_agent.mcp_server:main"
rm-web = "rm_agent.web:main"
rm-advise = "rm_agent.llm_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rm_agent"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

